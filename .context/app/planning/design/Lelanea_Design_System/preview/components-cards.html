<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Light + dark reflection cards" viewport="700x240" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">

</div>
<div class="card" style="background:#3A3F42;">
