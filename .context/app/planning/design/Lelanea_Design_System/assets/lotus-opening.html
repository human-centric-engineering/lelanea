<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lotus opening · Lelanea</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    gap: var(--sp-6);
    padding: var(--sp-6);
  }
  .frame { display: grid; gap: var(--sp-5); text-align: center; }
  .caption { color: var(--fg-secondary); font-size: var(--fs-body-s); }
  .replay {
    justify-self: center;
    margin-top: var(--sp-4);
  }
</style>
</head>
<body>
  <div class="frame">
    <div id="lotus-root"></div>
    <div class="caption">tap to replay · lotus opens once per session</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../ui_kits/lelanea_app/lotus-figure.jsx"></script>
  <script type="text/babel">
    const App = () => {
      const [k, setK] = React.useState(0);
      return (
        <div onClick={() => setK(k + 1)} style={{cursor:'pointer'}}>
          <Lotus key={k} size={182} />
        </div>
      );
    };
    ReactDOM.createRoot(document.getElementById('lotus-root')).render(<App />);
  </script>
</body>
</html>
